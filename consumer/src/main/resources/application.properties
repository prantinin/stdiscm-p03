# Consumer GUI Configuration (Member 3)
server.port=${GUI_PORT:8080}
spring.application.name=consumer-gui

# Catalog & Simulation Settings
media.use-fake=${USE_FAKE:true}
media.uploads-dir=${UPLOAD_DIR:./uploads}
media.previews-dir=${PREVIEW_DIR:./previews}
media.c=${C:2}
media.q=${Q:5}

# Logging configuration
logging.level.com.example.media=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
