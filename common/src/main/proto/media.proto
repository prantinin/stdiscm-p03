syntax = "proto3";
package media;
option java_package = "com.example.media.proto";
option java_multiple_files = true;
option java_outer_classname = "MediaProto";

service MediaUploadService {
  rpc Upload(stream UploadChunk) returns (UploadResult); // client streaming
  rpc GetQueueStatus(QueueStatusRequest) returns (QueueStatusResponse);
}

message UploadMeta {
  string producer_id = 1;
  string filename = 2;
  int64 size_bytes = 3;
  string sha256 = 4;
}

message UploadChunk {
  oneof payload {
    UploadMeta meta = 1; // always the FIRST message
    bytes data = 2;      // subsequent messages, each <= 256 KB
  }
}

enum UploadStatus {
  UNKNOWN = 0;
  ACCEPTED = 1;
  DROPPED_QUEUE_FULL = 2;
  DUPLICATE = 3;
  REJECTED_INVALID = 4;
}

message UploadResult {
  UploadStatus status = 1;
  string message = 2;
  string stored_name = 3;
  int32 retry_after_ms = 4;
}

message QueueStatusRequest {}

message QueueStatusResponse {
  int32 queue_length = 1;
  int32 queue_capacity = 2;
  bool full = 3;
}